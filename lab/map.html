<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data Tank・地圖原型</title>
<style>
:root{--bg:#ececec;--ink:#111;--mut:#7a7a7a;--line:rgba(0,0,0,.14);--amber:#c98a1b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
button{font:inherit;color:inherit}
#vp{position:fixed;inset:0;perspective:1500px;perspective-origin:44% 46%;background:radial-gradient(ellipse at 44% 46%,#f7f7f7 0%,#ececec 50%,#dedede 100%);touch-action:none;cursor:grab}
#vp:active{cursor:grabbing}
.stage{position:absolute;left:44%;top:46%;width:0;height:0;transform-style:preserve-3d;transition:opacity .5s,scale .6s cubic-bezier(.2,.7,.2,1)}
#globe,#book{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}

/* 地圖：中心線 + 每個領域一個方向，每個專案一條橫線，長度 = 完成度 */
.axis{position:absolute;left:-1.5px;width:3px;background:#111}
.circ{position:absolute;border:1px solid rgba(0,0,0,.2);border-radius:50%}
.circ.dash{border-style:dashed;border-color:rgba(0,0,0,.16)}
.branch{position:absolute;left:0;top:0;width:0;height:0;opacity:.3;transition:opacity .4s}
.branch.on{opacity:1}
.base{position:absolute;left:0;height:1px;background:rgba(0,0,0,.3)}
.dn{position:absolute;font-size:13px;font-weight:700;letter-spacing:.28em;white-space:nowrap;cursor:pointer;padding:6px 0}
.row{all:unset;position:absolute;left:0;height:30px;cursor:pointer}
.row .bar{position:absolute;left:0;bottom:0;height:2px;background:#111}
.row .rest{position:absolute;bottom:0;height:0;border-bottom:1px dashed rgba(0,0,0,.28)}
.row .end{position:absolute;bottom:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--bg)}
.row .end svg{display:block;width:14px;height:14px;overflow:visible}
.row svg *{fill:none;stroke:#111;stroke-width:1.6}
.row svg .fill{fill:#111}
.row .nm{position:absolute;left:14px;bottom:6px;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;font-size:13.5px;white-space:nowrap;color:#222}
.row .ct{position:absolute;bottom:-7px;font-size:11px;color:var(--mut);white-space:nowrap;letter-spacing:.06em}
.branch:not(.on) .ct{display:none}
.branch.on .row:hover .nm{font-weight:700;color:#000}
.branch.on .row:hover .bar{height:3px}
.branch.back .nm,.branch.back .dn,.branch.back .ct{transform:scaleX(-1)}
.branch:not(.on) .nm{opacity:0}
.branch .nm{transition:opacity .35s}
.pt{all:unset;display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer}
.pt svg{flex:none;width:14px;height:14px;overflow:visible}
.pt svg *{fill:none;stroke:#111;stroke-width:1.6}
.pt svg .fill{fill:#111}

/* 進入一個點：書頁環 */
body:not(.in) #bookstage{opacity:0;scale:.5;pointer-events:none}
body.in #mapstage{opacity:.1;scale:.62;pointer-events:none}
body.listmode #mapstage{opacity:0;pointer-events:none}
.spine{position:absolute;left:-3px;top:-58px;width:6px;height:116px;border-radius:3px;background:#111}
.pg{position:absolute;left:0;top:-48px;width:170px;height:96px;margin-left:16px;transform-origin:-16px 50%;transform:rotateY(var(--a));border-radius:0 5px 5px 0;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);cursor:pointer}
.pg img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pg.blank{background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.09);cursor:default}
.pg.todo{background:transparent;box-shadow:none;border:1px dashed rgba(0,0,0,.45);cursor:default}
.pg.stim{background:rgba(201,138,27,.14);box-shadow:none;border:1px dashed var(--amber);cursor:default}

.hud{position:fixed;z-index:5}
#top{left:16px;right:16px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
#top strong{font-size:13px;margin-right:4px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}
.chip:hover,.chip.on{background:#111;color:#fff;border-color:#111}
.sp{margin-left:auto}
/* 右下角列出所有領域：色體圖一次只讀一個方向，這裡補上全貌。點一下轉過去 */
#doms{right:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end}
#doms button{all:unset;position:relative;display:flex;align-items:baseline;gap:8px;padding:5px 12px 5px 0;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap;transition:color .25s}
#doms button em{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#aaa}
#doms button::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(0,0,0,.2)}
#doms button.cur{color:#111;font-weight:700}
#doms button.cur::after{right:-.5px;top:6px;bottom:6px;width:2px;background:#111}
#doms button:hover{color:#111}
body.in #doms,body.listmode #doms{display:none}
#legend{left:16px;bottom:16px;font-size:11.5px;line-height:1.9;color:var(--mut);letter-spacing:.06em}
#legend b{color:#333;font-weight:600}
body.in #legend,body.listmode #legend{display:none}
#head{left:0;right:0;top:64px;text-align:center;pointer-events:none;transition:opacity .4s}
body:not(.in) #head{opacity:0}
#head b{display:block;font-size:24px;letter-spacing:.04em}
#head small{display:block;margin-top:4px;font-size:12px;color:var(--mut);letter-spacing:.1em}
#back{left:16px;top:60px}
body:not(.in) #back,body:not(.in) #dock{display:none}
#dock{left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(245,245,245,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:18px;min-height:118px}
.blk{min-width:150px;max-width:260px;display:flex;flex-direction:column;gap:6px}
.blk.wide{flex:1;max-width:none;min-width:0}
.blk h4{margin:0;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.14em}
.blk p{margin:0;font-size:13px;line-height:1.5}
.blk p.q{color:var(--amber)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.strip a{flex:none;width:132px;color:inherit;text-decoration:none;font-size:12px;line-height:1.35}
.strip img{width:132px;height:74px;object-fit:cover;border-radius:5px;display:block;margin-bottom:4px;background:#ccc;box-shadow:0 0 0 1px var(--line)}
.strip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 快速瀏覽：純文字清單 */
#list{inset:56px 0 0 0;overflow-y:auto;padding:20px 24px 60px;display:none;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 28px;align-content:start}
body.listmode:not(.in) #list{display:grid}
#list h3{margin:0 0 8px;font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:600;border-bottom:1px solid #111;padding-bottom:6px}
#list .pt{position:static;display:flex;padding:6px 0;font-size:14.5px;opacity:1}
#list .pt em{font-style:normal;font-size:11px;color:var(--mut);margin-left:auto;padding-left:10px}
#bookstage{left:50%}
@media(max-width:700px){
  #mapstage{left:24%}
  .row .ct{display:none}
  body.in #bookstage{scale:.6}
  #back{top:98px}#head{top:140px}#head b{font-size:21px}
  #doms{bottom:56px}#doms button{padding:4px 12px 4px 0}
  #dock{flex-direction:column;gap:8px;max-height:40vh;overflow-y:auto}.blk{max-width:none}#legend{font-size:10.5px;line-height:1.7}}
</style>
</head>
<body>
<div id="vp">
  <div class="stage" id="mapstage"><div id="globe"></div></div>
  <div class="stage" id="bookstage"><div id="book"></div></div>
</div>
<div class="hud" id="top"><strong>手邊</strong><span id="tray"></span><span class="sp"></span>
  <button class="chip on" data-m="map">地圖</button><button class="chip" data-m="list">清單</button></div>
<div class="hud" id="legend"></div>
<nav class="hud" id="doms" aria-label="領域"></nav>
<div class="hud" id="head"></div>
<button class="hud chip" id="back">← 回地圖</button>
<div class="hud" id="list"></div>
<div class="hud" id="dock"></div>

<script>
const STATE={seed:'未開始',doing:'進行中',done:'完成',live:'持續更新'};
const ICON={
  seed:'<svg viewBox="-8 -8 16 16"><circle r="5" class="fill"/></svg>',
  doing:'<svg viewBox="-8 -8 16 16"><circle r="6" stroke-dasharray="27 11" transform="rotate(-90)"/></svg>',
  done:'<svg viewBox="-8 -8 16 16"><circle r="6"/></svg>',
  live:'<svg viewBox="-8 -8 16 16"><circle r="6.5"/><circle r="3"/></svg>'};
const ROOT='../', TILT=-11;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=f=>fetch(ROOT+f,{cache:'no-cache'}).then(r=>r.json()).catch(()=>[]);
let P=[],TRAY=[],DOMS=[],items={},brs=[],L=320,RG=34,yaw=0,tgt=0,focus=0,bookRot=0,cur=null;
const COMP={seed:.12,doing:.55,live:.8,done:1};   // 沒填 progress(0–10) 時用狀態推估
const comp=p=>p.progress!=null?Math.max(.05,Math.min(1,p.progress/10)):COMP[p.state];
const norm=a=>((a+180)%360+360)%360-180;

function thumbs(it,max){
  if(it.kind==='site')return [ROOT+'sites/'+it.d.shot];
  const s=it.d.slides,n=Math.min(max,s.length),out=[];
  for(let i=0;i<n;i++)out.push(ROOT+'decks/'+encodeURIComponent(it.d.id)+'/'+s[Math.floor(i*s.length/n)].replace(/^s-/,'t-'));
  return out;
}
const img=src=>`<img src="${esc(src)}" onerror="this.onerror=null;this.src=this.src.replace('/t-','/s-')" draggable="false" alt="">`;
function pool(p,n){
  const lists=p.its.map(it=>thumbs(it,n)),out=[];
  for(let k=0;out.length<n&&lists.some(l=>l[k]);k++)lists.forEach((l,li)=>{if(l[k]&&out.length<n)out.push({s:l[k],k:li})});
  const base=out.slice();
  while(out.length&&out.length<Math.min(6,n))out.push(base[out.length%base.length]);
  return out;
}

/* ---------- 地圖 ---------- */
function buildMap(){
  L=Math.max(150,Math.min(innerWidth*(innerWidth<700?.56:.4),400));RG=Math.max(26,Math.min(36,innerHeight*.045));
  // 每個群組只畫最新的 MAX 件；再照完成度排：短的在上、長的在下 → 樹形（一樣長的新的在上）
  const per=DOMS.map(d=>P.map((p,i)=>({p,i})).filter(o=>o.p.dom===d).sort((a,b)=>(b.p.last||'').localeCompare(a.p.last||'')).slice(0,MAX).sort((a,b)=>comp(a.p)-comp(b.p)));
  const maxN=Math.max(...per.map(a=>a.length)),y0=maxN*RG/2+10;
  const circ=(r,cls='')=>`<div class="circ ${cls}" style="left:${-r}px;top:${-r}px;width:${2*r}px;height:${2*r}px;transform:translateY(${y0}px) rotateX(90deg)"></div>`;
  let h=`<div class="axis" style="top:${y0-maxN*RG-46}px;height:${maxN*RG+46}px"></div>`+circ(L)+circ(L*.5,'dash');
  per.forEach((list,di)=>{
    let b=`<div class="base" style="top:${y0}px;width:${L}px"></div><span class="dn" data-d="${di}" style="left:${L+18}px;top:${y0-16}px">${esc(DOMS[di])}</span>`;
    list.forEach((o,k)=>{
      const w=comp(o.p)*L,y=y0-(list.length-k)*RG-30;
      b+=`<button class="row" data-i="${o.i}" data-d="${di}" style="top:${y}px;width:${L}px">
        <span class="bar" style="width:${w.toFixed(0)}px"></span><span class="rest" style="left:${w.toFixed(0)}px;width:${(L-w).toFixed(0)}px"></span>
        <span class="end" style="left:${w.toFixed(0)}px">${ICON[o.p.state]}</span>
        <span class="nm">${esc(o.p.name)}</span><span class="ct" style="left:${L+18}px">${STATE[o.p.state]}${o.p.last?' · '+o.p.last.replace(/-/g,'.'):''}</span></button>`;
    });
    h+=`<div class="branch" data-d="${di}">${b}</div>`;
  });
  $('#globe').innerHTML=h;
  brs=[...document.querySelectorAll('#globe .branch')];
  $('#doms').innerHTML=DOMS.map((d,i)=>`<button data-d="${i}">${esc(d)}<em>${String(P.filter(p=>p.dom===d).length).padStart(2,'0')}</em></button>`).join('');
  setFocus(focus);
}
const CLEAR=108;   // 閱讀中的方向兩側各讓出這麼多度，其他方向擠到左半邊
let ang=[],angT=[];
function setFocus(i){
  const n=DOMS.length;focus=((i%n)+n)%n;
  document.querySelectorAll('#doms button').forEach(b=>b.classList.toggle('cur',+b.dataset.d===focus));
  if(ang.length!==n)ang=DOMS.map((_,k)=>k*360/n);
  tgt=yaw-norm(yaw+ang[focus]);
  angT=ang.map((a,k)=>{const j=((k-focus)%n+n)%n;return j===0?ang[focus]:ang[focus]+CLEAR+(n>2?(j-1)*(360-2*CLEAR)/(n-2):0)});
}
function buildList(){
  $('#list').innerHTML=DOMS.map(d=>`<section><h3>${esc(d)}</h3>${P.map((p,i)=>({p,i})).filter(o=>o.p.dom===d).sort((a,b)=>(b.p.last||'').localeCompare(a.p.last||'')).map(({p,i})=>`<button class="pt" data-i="${i}">${ICON[p.state]}<span>${esc(p.name)}</span><em>${(p.last||'').replace(/-/g,'.')||'—'}</em></button>`).join('')}</section>`).join('');
  $('#tray').innerHTML=TRAY.map(id=>{const i=P.findIndex(p=>p.id===id);return i<0?'':`<button class="chip" data-i="${i}">${esc(P[i].name)}</button>`}).join(' ');
  $('#legend').innerHTML='線越長 = 完成度越高　·　滾輪、拖曳或按 ← → 換領域';
}

/* ---------- 書頁環：像把活頁本翻開 360 度 ---------- */
function openBook(i){
  const p=cur=P[i],n=16,gap=p.state==='doing'?4:0;
  const pg=(k,inner,cls='',it)=>`<span class="pg ${cls}"${it==null?'':` data-k="${it}"`} style="--a:${(k*360/n).toFixed(1)}deg">${inner}</span>`;
  let h='';
  if(p.state==='seed')for(let k=0;k<n;k++)h+=k%3?'':pg(k,'','stim');
  else{
    const im=pool(p,n-gap);
    for(let k=0;k<n-gap;k++){const a=Math.floor(k*im.length/(n-gap)),b=Math.floor((k-1)*im.length/(n-gap));h+=im.length&&(k===0||a!==b)?pg(k,img(im[a].s),'',im[a].k):pg(k,'','blank')}
    for(let k=n-gap;k<n;k++)h+=pg(k,'','todo');
  }
  $('#book').innerHTML=h+'<div class="spine"></div>';
  $('#head').innerHTML=`<b>${esc(p.name)}</b><small>${[p.dom,(p.last||'').replace(/-/g,'.'),STATE[p.state],p.who==='self'?'給自己看':'給別人看'].filter(Boolean).map(esc).join(' · ')}</small>`;
  dock(p);bookRot=20;document.body.classList.add('in');
}
const closeBook=()=>{document.body.classList.remove('in');cur=null};
function dock(p){
  const strip=p.its.length?`<div class="strip">${p.its.map(it=>`<a href="${esc(it.href)}" target="_blank" rel="noopener">${img(thumbs(it,1)[0])}<span>${esc(it.title)}</span></a>`).join('')}</div>`:'<p>還沒有內容。第一份資料放進來後會出現在這裡。</p>';
  const B={
    all:`<div class="blk wide"><h4>全貌</h4>${strip}</div>`,
    prog:`<div class="blk"><h4>${p.state==='done'?'過去的進度':'進度'}</h4><p class="${p.state==='done'?'':'q'}">${esc(p.state==='done'?'已完成'+(p.last?'，最後更新 '+p.last:''):(p.next||'還沒寫下一步'))}</p></div>`,
    stim:`<div class="blk"><h4>新的刺激</h4><p>${p.state==='seed'?'空白頁，等資料進來':'目前沒有新資料'}</p></div>`};
  $('#dock').innerHTML={doing:['prog','all'],live:['prog','all'],done:['all','stim','prog'],seed:['stim','prog','all']}[p.state].map(k=>B[k]).join('');
}

/* ---------- 互動 ---------- */
let drag=null,last=0;
$('#vp').addEventListener('pointerdown',e=>{drag={x:e.clientX,moved:0,t:e.target}});
addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x;drag.x=e.clientX;drag.moved+=Math.abs(dx);
  if(cur)bookRot+=dx*.45;else{yaw+=dx*.35;tgt=yaw}
});
addEventListener('pointerup',()=>{
  if(drag&&drag.moved<6){
    const t=drag.t,b=t.closest('.row'),dn=t.closest('.dn'),g=t.closest('.pg[data-k]');
    if(b){if(+b.dataset.d===focus)openBook(+b.dataset.i);else setFocus(+b.dataset.d)}
    else if(dn)setFocus(+dn.dataset.d);
    else if(g&&cur)open(cur.its[+g.dataset.k].href,'_blank','noopener');
    else if(cur&&!t.closest('.pg'))closeBook();
  }
  else if(drag&&!cur){let best=0,bd=1e9;DOMS.forEach((_,i)=>{const d=Math.abs(norm(yaw+ang[i]));if(d<bd){bd=d;best=i}});setFocus(best)}
  drag=null;
});
document.addEventListener('click',e=>{
  const b=e.target.closest('#list .pt,#tray .chip');if(b)return openBook(+b.dataset.i);
  const m=e.target.closest('[data-m]');
  if(m){closeBook();document.body.classList.toggle('listmode',m.dataset.m==='list');document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===m))}
});
let wacc=0,wlast=0,wlock=false;
$('#vp').addEventListener('wheel',e=>{
  e.preventDefault();
  const d=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  if(cur){bookRot+=d*.25;return}          // 在書頁環裡：滾輪直接轉書
  // 一次滾動手勢只換一格：換完後要等滾輪完全停下來（200ms 沒有訊號）才接受下一次
  const now=performance.now(),quiet=now-wlast;wlast=now;
  // 不鎖時間，只看滾了多遠：每累積 STEP 的距離換一格，滾得快就連續換好幾格
  const STEP=90;
  if(quiet>300)wacc=0;
  wacc+=d;
  while(Math.abs(wacc)>=STEP){const s=Math.sign(wacc);setFocus(focus+s);wacc-=s*STEP}
},{passive:false});
$('#doms').onclick=e=>{const b=e.target.closest('button');if(b)setFocus(+b.dataset.d)};
$('#back').onclick=closeBook;
addEventListener('keydown',e=>{if(e.key==='Escape')closeBook();if(!cur&&e.key==='ArrowRight')setFocus(focus+1);if(!cur&&e.key==='ArrowLeft')setFocus(focus-1)});
addEventListener('resize',()=>{buildMap()});
function frame(t=0){
  const dt=Math.min(100,t-last);last=t;
  if(!drag){if(cur)bookRot+=dt*.006;else{yaw+=(tgt-yaw)*(1-Math.exp(-dt/140));if(Math.abs(tgt-yaw)<.05)yaw=tgt}}
  $('#globe').style.transform=`rotateX(${TILT}deg) rotateY(${yaw.toFixed(2)}deg)`;
  $('#book').style.transform=`rotateX(-14deg) rotateY(${bookRot.toFixed(2)}deg)`;
  const k=1-Math.exp(-dt/160);
  brs.forEach((b,i)=>{if(!drag)ang[i]+=norm(angT[i]-ang[i])*k;b.style.transform=`rotateY(${ang[i].toFixed(2)}deg)`;const a=(yaw+ang[i])*Math.PI/180;b.classList.toggle('back',Math.cos(a)<0);b.classList.toggle('on',i===focus)});
  requestAnimationFrame(frame);
}
/* 資料：總列表（decks.json、sites.json）的每一件作品就是一條線，方向＝它在首頁的群組（照 groups.json 的順序）。
   新作品加進總列表就會自動出現，擠掉那個群組最舊的一條。projects.json 只放選填的補充（狀態、下一步、手邊） */
const MAX=8;
Promise.all([get('decks.json'),get('sites.json'),get('groups.json'),fetch('projects.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({}))]).then(([d,s,gs,pj])=>{
  d.forEach(x=>items[x.id]={kind:'deck',d:x,title:x.title,date:x.date,group:x.group,href:ROOT+'play.html?deck='+encodeURIComponent(x.id)});
  s.forEach(x=>items[x.id]={kind:'site',d:x,title:x.title,date:x.date,group:x.group,href:/^[a-z]+:|^\//i.test(x.url)?x.url:ROOT+x.url});   // 站內網址（例如 web/sailboat/）是相對於首頁寫的
  const W=pj.works||{};
  P=Object.entries(items).map(([id,it])=>({id,name:it.title,dom:it.group||'未分類',state:'done',who:'show',...W[id],its:[it],last:it.date}));
  DOMS=[...gs,'未分類'].filter((g,i,a)=>a.indexOf(g)===i&&P.some(p=>p.dom===g));
  P.forEach(p=>{if(!DOMS.includes(p.dom))DOMS.push(p.dom)});
  TRAY=(pj.tray||[]).filter(id=>P.some(p=>p.id===id));
  buildMap();buildList();frame();
});
</script>
