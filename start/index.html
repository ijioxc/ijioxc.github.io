<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23ef8fb0'/><circle cx='16' cy='16' r='5' fill='white'/></svg>">
<style>
:root{
  --bg:#ececec; --fg:#111113; --mute:#6c6c73; --faint:#a5a5ab;
  --line:rgba(0,0,0,.09); --panel:rgba(0,0,0,.05); --ring:rgba(0,0,0,.1);
  --bar:rgba(246,246,246,.6); --btn:#111113; --on-btn:#fff;
  --glass:linear-gradient(150deg,rgba(255,214,228,.62),rgba(255,182,206,.30));
  --glass-edge:rgba(255,255,255,.7);
  --tile:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.45));
  --blob-o:.8; --sea:linear-gradient(180deg,#d7eef6 0%,#9ccfe4 45%,#3f8db8 100%); --late:#e5484d; --soon:#c76a00;
  --shadow:0 24px 50px -24px rgba(120,20,60,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0b0e; --fg:#f2f0f3; --mute:#9a96a0; --faint:#625e68;
    --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.07); --ring:rgba(255,255,255,.14);
    --bar:rgba(14,12,16,.55); --btn:#f2f0f3; --on-btn:#111113;
    --glass:linear-gradient(150deg,rgba(255,120,170,.16),rgba(255,90,150,.06));
    --glass-edge:rgba(255,190,215,.22);
    --tile:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    --blob-o:.5; --sea:linear-gradient(180deg,#0a2236 0%,#0b3350 50%,#06192b 100%); --shadow:0 24px 50px -24px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0b0e; --fg:#f2f0f3; --mute:#9a96a0; --faint:#625e68;
  --line:rgba(255,255,255,.09); --panel:rgba(255,255,255,.07); --ring:rgba(255,255,255,.14);
  --bar:rgba(14,12,16,.55); --btn:#f2f0f3; --on-btn:#111113;
  --glass:linear-gradient(150deg,rgba(255,120,170,.16),rgba(255,90,150,.06));
  --glass-edge:rgba(255,190,215,.22);
  --tile:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  --blob-o:.5; --sea:linear-gradient(180deg,#0a2236 0%,#0b3350 50%,#06192b 100%); --shadow:0 24px 50px -24px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 海洋藍模糊底色：淺海在上、深海在下 */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--sea)}
.field i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:var(--blob-o);animation:drift 30s ease-in-out infinite alternate}
.field i:nth-child(1){background:#8fd6e8;left:-10vmax;top:-14vmax}
.field i:nth-child(2){background:#3aa6c9;right:-12vmax;top:4vmax;animation-delay:-7s}
.field i:nth-child(3){background:#1f6fa3;left:26vw;top:42vh;animation-delay:-14s}
.field i:nth-child(4){background:#0f4c7a;right:4vw;bottom:-20vmax;animation-delay:-20s}
.field i:nth-child(5){background:#2bb3a8;left:-8vmax;bottom:-16vmax;animation-delay:-10s}
@keyframes drift{to{transform:translate(6vw,-5vh) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.field i{animation:none}}

header{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:650;letter-spacing:-.01em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--fg)}
.round{width:34px;height:34px;border-radius:999px;border:0;background:var(--panel);color:var(--mute);display:grid;place-items:center;cursor:pointer;transition:color .2s}
.round:hover{color:var(--fg)}

main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 64px}

.hero{padding:64px 0 36px;display:flex;flex-direction:column;align-items:center;text-align:center}
.clock{font-size:clamp(64px,11vw,112px);font-weight:650;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hero .mono{margin-top:12px}
.search{margin-top:30px;width:min(640px,100%);display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 20px;border-radius:999px;
  background:var(--tile);box-shadow:0 0 0 1px var(--glass-edge),inset 0 1px 1px rgba(255,255,255,.6),var(--shadow);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);color:var(--mute)}
.search:focus-within{color:var(--fg)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--fg);font:inherit;font-size:16px}
.search input::placeholder{color:var(--faint)}
.search .go{height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--btn);color:var(--on-btn);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.hint{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hint span{padding:3px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ring)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
/* TOWAN 粉紅玻璃：卡片本身是半透明桃紅，白字 */
.glass{position:relative;border-radius:24px;padding:20px;overflow:hidden;
  background:rgba(240,40,115,.8);
  backdrop-filter:blur(48px) saturate(1.3);-webkit-backdrop-filter:blur(48px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 2px 20px rgba(255,255,255,.15),0 30px 60px -20px rgba(0,0,0,.3);
  --fg:#fff; --mute:rgba(255,255,255,.75); --faint:rgba(255,255,255,.45);
  --ring:rgba(255,255,255,.3); --panel:rgba(255,255,255,.14);
  --tile:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.22);
  --btn:#fff; --on-btn:#e5004e; --soon:#ffd27a;
  color:var(--fg)}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(255,255,255,.03)}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,.05) 20%,transparent 50%,rgba(0,0,0,.1) 100%)}
.glass .ic .sq{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 1px rgba(255,255,255,.35),0 8px 20px -12px rgba(80,0,30,.6)}
.glass .ic.key .sq{box-shadow:0 10px 24px -10px rgba(80,0,30,.6)}
.glass .ic.empty .sq{box-shadow:none}
.glass .days.late{background:#fff;color:#e5004e}
.glass .add input::placeholder{color:rgba(255,255,255,.6)}
.glass .add input{color-scheme:dark}
.glass > *{position:relative;z-index:1}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.head b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.head a{color:var(--mute);text-decoration:none}
.head a:hover{color:var(--fg)}
.school{grid-column:1/9}
.tasks{grid-column:9/13;grid-row:1/4;display:flex;flex-direction:column}
.mine{grid-column:1/6}
.ai{grid-column:6/9}
.race{grid-column:1/9}
@media (max-width:940px){
  .school,.tasks,.mine,.ai,.race{grid-column:1/-1;grid-row:auto}
}

/* icon tiles */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:14px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--fg);border-radius:16px;padding:4px 0;outline:0}
.ic .sq{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--tile);
  box-shadow:0 0 0 1px var(--glass-edge),inset 0 1px 1px rgba(255,255,255,.8),0 8px 20px -12px rgba(120,20,60,.5);
  transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
:root[data-theme="dark"] .ic .sq{box-shadow:0 0 0 1px var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ic .sq{box-shadow:0 0 0 1px var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.12)}}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic span{font-size:12px;font-weight:500;color:var(--mute);transition:color .2s;white-space:nowrap}
.ic:hover .sq,.ic:focus-visible .sq{transform:translateY(-4px);box-shadow:0 0 0 1.5px var(--fg),0 14px 26px -12px rgba(120,20,60,.55)}
.ic:hover span,.ic:focus-visible span{color:var(--fg)}
.ic.empty .sq{background:none;box-shadow:none;border:1.5px dashed var(--faint);color:var(--faint)}
.ic.empty span{color:var(--faint)}
.brand svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.ic.key .sq{background:var(--btn);color:var(--on-btn);box-shadow:0 10px 24px -10px rgba(120,20,60,.6)}

/* tasks */
.list{flex:1;display:flex;flex-direction:column;gap:8px;min-height:120px}
.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--tile);box-shadow:0 0 0 1px var(--glass-edge)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0}
.chk:hover{border-color:var(--fg)}
.task.done .chk{background:var(--fg);border-color:var(--fg);color:var(--on-btn)}
.task .n{font-weight:600;font-size:14px;line-height:1.35}
.task.done .n{color:var(--faint);text-decoration:line-through}
.task .m{font-size:12px;color:var(--mute)}
.task .r{display:flex;align-items:center;gap:4px}
.days{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;padding:3px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ring);white-space:nowrap}
.days.soon{color:var(--soon);box-shadow:inset 0 0 0 1px currentColor}
.days.late{color:#fff;background:var(--late);box-shadow:none}
.x{width:24px;height:24px;border:0;border-radius:50%;background:none;color:var(--faint);cursor:pointer;font-size:15px;opacity:0;transition:opacity .2s,background .2s,color .2s}
.task:hover .x{opacity:1}
.x:hover{background:var(--late);color:#fff}
.meter{height:4px;border-radius:99px;background:var(--panel);overflow:hidden;margin:-6px 0 14px}
.meter i{display:block;height:100%;width:0;background:var(--fg);transition:width .4s}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.add input{min-width:0;font:inherit;font-size:13px;padding:10px 14px;border:0;border-radius:999px;background:var(--tile);box-shadow:0 0 0 1px var(--glass-edge);color:var(--fg);outline:0}
.add input:focus{box-shadow:0 0 0 1.5px var(--fg)}
.add .wide{grid-column:1/-1}
.add button{border:0;border-radius:999px;background:var(--btn);color:var(--on-btn);font:inherit;font-size:13px;font-weight:500;padding:0 18px;cursor:pointer}
.none{color:var(--mute);font-size:13px;text-align:center;padding:24px 0}
footer{position:relative;z-index:1;text-align:center;padding-bottom:28px}
</style>
</head>

<main>

    <div class="glass mine">
      <div class="head"><b>我的</b><a class="mono" href="https://github.com/ijioxc/ijioxc">GitHub ↗</a></div>
      <nav class="icons" id="mine"></nav>

      <div class="head"><b>AI</b></div>

    </div>

    <div class="glass race">

      <nav class="icons" id="race"></nav>
    </div>
  </section>
</main>
<footer class="mono">任務存在這台瀏覽器</footer>

};
const ENGINES = {
  "":  "https://www.google.com/search?q=%s",
  yt:  "https://www.youtube.com/results?search_query=%s",
  gh:  "https://github.com/search?q=%s",
  nk:  "https://www.google.com/search?q=site%3Ankust.edu.tw+%s",
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};

for (const [id, list] of Object.entries(LINKS)) {
  $("#" + id).innerHTML = list.map(l => !l.u
    ? `<span class="ic empty" title="尚未設定"><span class="sq"><svg viewBox="0 0 24 24">${I[l.i]}</svg></span><span>${esc(l.t)}</span></span>`
    : `<a class="ic${l.key ? " key" : ""}" href="${esc(l.u)}" title="${esc(l.t)}">
       <span class="sq"><svg viewBox="0 0 24 24">${I[l.i]}</svg></span><span>${esc(l.t)}</span></a>`).join("");
}

/* clock */
const WD = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
function tick(){
  const n = new Date(), p = x => String(x).padStart(2, "0");
  $("#clock").textContent = `${p(n.getHours())}:${p(n.getMinutes())}`;
  $("#date").textContent = `${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())} ${WD[n.getDay()]}`;
  const h = n.getHours();
  $("#greet").textContent = h < 5 ? "夜深了，早點睡" : h < 11 ? "早安" : h < 14 ? "午安" : h < 18 ? "下午好" : "晚安";
}
tick(); setInterval(tick, 1000);

/* theme */
const root = document.documentElement;
const th = store.get("sp:theme", null); if (th) root.dataset.theme = th;
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("sp:theme", root.dataset.theme);
};

/* search */
$("#search").onsubmit = e => {
  e.preventDefault();
  let q = $("#q").value.trim(); if (!q) return;
  let url = ENGINES[""];
  const m = q.match(/^(\w+)\s+(.+)$/);
  if (m && ENGINES[m[1].toLowerCase()]) { url = ENGINES[m[1].toLowerCase()]; q = m[2]; }
  else if (/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)) { location.href = /^https?:/.test(q) ? q : "https://" + q; return; }
  location.href = url.replace("%s", encodeURIComponent(q));
};
addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});

/* tasks */
let tasks = store.get("sp:tasks2", []);
const left = d => { if (!d) return null; const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d + "T00:00") - t) / 864e5); };
function render(){
  const s = [...tasks].sort((a, b) => (a.done - b.done) || (a.due || "9").localeCompare(b.due || "9"));
  const done = tasks.filter(t => t.done).length;
  $("#count").textContent = tasks.length ? `${done} / ${tasks.length}` : "";
  $("#meter").style.width = tasks.length ? done / tasks.length * 100 + "%" : "0";
  $("#list").innerHTML = s.length ? s.map(t => {
    const d = left(t.due);
    let tag = "";
    if (d !== null && !t.done) {
      const c = d < 0 ? "late" : d <= 3 ? "soon" : "";
      tag = `<span class="days ${c}">${d < 0 ? `逾期 ${-d}d` : d === 0 ? "今天" : `D-${d}`}</span>`;
    }
    return `<div class="task${t.done ? " done" : ""}">
      <button class="chk" data-id="${t.id}" title="完成"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg></button>
      <div><div class="n">${esc(t.name)}</div>${t.due ? `<div class="m">${t.due.replace(/-/g, ".")}</div>` : ""}</div>
      <div class="r">${tag}<button class="x" data-id="${t.id}" title="刪除">✕</button></div></div>`;
  }).join("") : `<div class="none">還沒有大任務</div>`;
  document.querySelectorAll(".chk").forEach(b => b.onclick = () => { const t = tasks.find(t => t.id == b.dataset.id); t.done = !t.done; save(); });
  document.querySelectorAll(".x").forEach(b => b.onclick = () => { tasks = tasks.filter(t => t.id != b.dataset.id); save(); });
}
function save(){ store.set("sp:tasks2", tasks); render(); }
$("#add").onsubmit = e => {
  e.preventDefault();
  tasks.push({ id: Date.now(), name: $("#tn").value.trim(), due: $("#td").value, done: false });
  e.target.reset(); save();
};
render();
</script>
</body>
</html>
