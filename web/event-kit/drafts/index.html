<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>草稿版型</title>
<!-- 簡單草稿：沿用模板七的米色底、紅色塊、邱比特。?d=<id> 顯示單張，render.sh 會把每張算成 ../art/<id>.png -->
<style>
html,body{margin:0;background:#888}
body{font-family:"PingFang TC",sans-serif}
section{display:none;position:relative;overflow:hidden;width:var(--w);height:var(--h);
  background:linear-gradient(160deg,#c2b9b0,#d3cac1);color:#e6d0ce}
section.on{display:block}
section *{position:absolute;margin:0;white-space:nowrap}
.glow{background:#a44946;filter:blur(var(--blur,18px));opacity:.85}
.panel{background:#a44946;overflow:hidden}
.wm{color:#b82f2d;opacity:.3;font-weight:500;line-height:.8}
.cupid{transform:scaleX(-1);height:auto}
.title{font-weight:600;letter-spacing:.08em;color:#dfc4c3;line-height:1}
.light{color:#f3e6e4}
.red{color:#a44946}
.r{text-align:right}
.date{width:3.5em;height:1.95em;font-weight:500;line-height:1;color:#ead9d7}
.date span:first-child{left:0;top:0}
.date span:last-child{right:0;bottom:0}
.date i{left:50%;top:50%;width:2.7em;height:.028em;background:currentColor;transform:translate(-50%,-50%) rotate(-42deg)}
.list{line-height:1.75;white-space:pre;font-weight:500}
.slot{border:2px dashed rgba(255,255,255,.45);display:grid;place-items:center;color:rgba(255,255,255,.6)}
.slot *{position:static}
nav{padding:40px;font-size:20px;background:#fff;line-height:2}
nav a{display:block;position:static}
</style>
</head>
<body>

<!-- 活動大成功貼文 1080 × 1350 -->
<section id="success" style="--w:1080px;--h:1350px">
  <div class="glow" style="left:128px;top:156px;width:824px;height:1037px"></div>
  <div class="panel" style="left:128px;top:156px;width:824px;height:1037px">
    <div class="wm" style="right:-6px;top:-14px;font-size:300px">Thx</div>
    <div class="wm" style="right:-4px;bottom:-26px;font-size:250px">高科大</div>
  </div>
  <img class="cupid" src="cupid.png" style="left:-4px;top:-8px;width:614px">
  <div class="title" style="left:172px;top:420px;font-size:112px">活動大成功</div>
  <div class="light" style="left:176px;top:560px;font-size:34px;letter-spacing:.2em">聖誕晚會　圓滿落幕</div>
  <div class="slot" style="left:176px;top:640px;width:728px;height:400px"><span style="font-size:28px;letter-spacing:.2em">合照放這裡</span></div>
  <div class="light" style="left:176px;top:1070px;font-size:30px;letter-spacing:.1em">謝謝每一位來玩的你，明年見。</div>
  <div class="red r" style="right:128px;top:1212px;font-size:38px;font-weight:600;letter-spacing:.06em">2026.12.22　建工校區 中正堂</div>
</section>

<!-- 表單封面圖 1600 × 400 -->
<section id="form-header" style="--w:1600px;--h:400px;--blur:10px">
  <div class="glow" style="left:430px;top:48px;width:1110px;height:304px"></div>
  <div class="panel" style="left:430px;top:48px;width:1110px;height:304px">
    <div class="wm" style="right:-6px;top:-8px;font-size:250px">Tue</div>
  </div>
  <img class="cupid" src="cupid.png" style="left:-150px;top:-135px;width:800px">
  <div class="title" style="left:560px;top:110px;font-size:92px">聖誕晚會</div>
  <div class="light" style="left:564px;top:232px;font-size:34px;letter-spacing:.3em">報名表單</div>
  <div class="date" style="left:1000px;top:112px;font-size:58px"><span>12</span><i></i><span>22</span></div>
  <div class="light r" style="right:90px;top:282px;font-size:24px;letter-spacing:.06em">19:00 – 22:00　建工校區 中正堂</div>
</section>

<!-- 名牌 1063 × 1535：只有方塊，文字由網頁文字層疊上去（名字基線 y=790、小字 y=930） -->
<section id="badge-staff" style="--w:1063px;--h:1535px">
  <div class="glow" style="left:110px;top:467px;width:843px;height:600px"></div>
  <div class="panel" style="left:110px;top:467px;width:843px;height:600px"></div>
</section>
<section id="badge-guest" style="--w:1063px;--h:1535px">
  <div class="glow" style="left:110px;top:467px;width:843px;height:600px"></div>
  <div class="panel" style="left:110px;top:467px;width:843px;height:600px"></div>
</section>

<!-- 背板 3000 × 2000 -->
<section id="backdrop" style="--w:3000px;--h:2000px;--blur:36px">
  <div class="glow" style="left:340px;top:240px;width:2320px;height:1500px"></div>
  <div class="panel" style="left:340px;top:240px;width:2320px;height:1500px">
    <div class="wm" style="right:-14px;top:-30px;font-size:820px">Tue</div>
    <div class="wm" style="right:-10px;bottom:-60px;font-size:580px">高科大</div>
  </div>
  <img class="cupid" src="cupid.png" style="left:-12px;top:-20px;width:1700px">
  <div class="title" style="left:470px;top:1180px;font-size:330px">聖誕晚會</div>
  <div class="date" style="left:2030px;top:1100px;font-size:170px"><span>12</span><i></i><span>22</span></div>
  <div class="red r" style="right:340px;top:1790px;font-size:84px;font-weight:600;letter-spacing:.06em">2026.12.22　建工校區 中正堂</div>
</section>

<nav id="nav"></nav>
<script>
const d = new URLSearchParams(location.search).get('d');
const all = [...document.querySelectorAll('section')];
if (d) { document.getElementById(d)?.classList.add('on'); document.getElementById('nav').remove(); }
else document.getElementById('nav').innerHTML = all.map(s => `<a href="?d=${s.id}">${s.id}</a>`).join('');
</script>
</body>
</html>
