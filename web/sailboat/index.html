<style>
/* ── 色彩：Claude（Anthropic 官方色）。象牙底、近黑字、Claude 橘＝唯一重點色；版面照 NKUST Racing 工作台，頂列照 Data Tank ── */
:root{
  --bg:#f0eee6;--fg:#141413;--mute:#73726c;--faint:#a3a199;--line:rgba(20,20,19,.09);--line-2:rgba(20,20,19,.16);--panel:rgba(20,20,19,.05);--ring:rgba(20,20,19,.1);
  --bar:rgba(240,238,230,.8);--glow:rgba(250,249,245,.7);--btn:#141413;--on-btn:#faf9f5;--tile:rgba(250,249,245,.7);--tile-s:#faf9f5;
  --card-fill:#f8f7f2;--card-edge:rgba(255,255,255,.6);--card-hl:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -.5px 0 rgba(0,0,0,.03);--card-sh:0 1px 3px rgba(20,20,19,.04),0 12px 32px rgba(20,20,19,.06);
  --shadow:0 24px 50px -24px rgba(20,20,19,.3);--glass:linear-gradient(145deg,rgba(250,249,245,.9),rgba(250,249,245,.5));--glass-edge:rgba(250,249,245,.9);
  --hot:#d97757;--on-hot:#fff;--late:#c4553f;--ok:#141413;
  --me:#6a9bcc;--mate:#788c5d;--claude:#c46686;
  --font-mono:"IBM Plex Mono",var(--font-mono);
  --serif:Lora,Georgia,"Songti TC","Noto Serif TC",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624;--fg:#faf9f5;--mute:#b0aea5;--faint:#7c7a74;--line:rgba(250,249,245,.08);--line-2:rgba(250,249,245,.16);--panel:rgba(250,249,245,.06);--ring:rgba(250,249,245,.12);
  --bar:rgba(38,38,36,.8);--glow:rgba(250,249,245,.03);--btn:#faf9f5;--on-btn:#141413;--tile:rgba(48,48,46,.74);--tile-s:#30302e;
  --card-fill:#30302e;--card-edge:rgba(255,255,255,.09);--card-hl:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -.5px 0 rgba(0,0,0,.18);--card-sh:0 1px 3px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.28);
  --shadow:0 24px 50px -24px rgba(0,0,0,.7);--glass:linear-gradient(145deg,rgba(250,249,245,.12),rgba(250,249,245,.03));--glass-edge:rgba(250,249,245,.12);
  --hot:#e0825f;--on-hot:#fff;--late:#e5735f;--ok:#faf9f5;--me:#8db4dc;--mate:#9bb07e;--claude:#d68aa3;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#262624;--fg:#faf9f5;--mute:#b0aea5;--faint:#7c7a74;--line:rgba(250,249,245,.08);--line-2:rgba(250,249,245,.16);--panel:rgba(250,249,245,.06);--ring:rgba(250,249,245,.12);
  --bar:rgba(38,38,36,.8);--glow:rgba(250,249,245,.03);--btn:#faf9f5;--on-btn:#141413;--tile:rgba(48,48,46,.74);--tile-s:#30302e;
  --card-fill:#30302e;--card-edge:rgba(255,255,255,.09);--card-hl:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -.5px 0 rgba(0,0,0,.18);--card-sh:0 1px 3px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.28);
  --shadow:0 24px 50px -24px rgba(0,0,0,.7);--glass:linear-gradient(145deg,rgba(250,249,245,.12),rgba(250,249,245,.03));--glass-edge:rgba(250,249,245,.12);
  --hot:#e0825f;--on-hot:#fff;--late:#e5735f;--ok:#faf9f5;--me:#8db4dc;--mate:#9bb07e;--claude:#d68aa3;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:520px;background:radial-gradient(60% 100% at 50% 0,var(--glow),transparent 70%);pointer-events:none;z-index:0}
.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
button{font:inherit;color:inherit}
a{color:inherit}

/* ── 頂列 ── */
header{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;text-decoration:none;min-width:0}
.brand svg{width:28px;height:28px;flex:none}   /* 三葉結：拓撲學最基本的紐結 */
.brand b{font-size:15px;font-weight:650;white-space:nowrap}
.brand .mono{overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;padding:3px;background:var(--panel);border-radius:999px}
.tabs a{display:block;color:var(--mute);text-decoration:none;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;padding:7px 14px;border-radius:999px;transition:color .2s,background .2s}
.tabs a:hover{color:var(--fg)}
.tabs a.on{background:var(--btn);color:var(--on-btn)}
.ib{display:grid;place-items:center;flex:none;width:36px;height:36px;border:0;border-radius:999px;background:var(--panel);color:var(--mute);cursor:pointer;transition:color .2s}
.ib:hover{color:var(--fg)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;z-index:1;animation:fade .45s both}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ── 共用 ── */
.tile{background:var(--card-fill);border:.5px solid var(--card-edge);border-radius:20px;box-shadow:var(--card-hl),var(--card-sh);padding:20px 22px 22px;min-width:0}
.tile>h3,.sec h3{margin:0 0 14px;display:flex;align-items:center;gap:10px}
.sec{display:flex;align-items:center;gap:14px;margin:0 0 20px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.meter{height:4px;border-radius:4px;background:var(--panel);overflow:hidden}
.meter i{display:block;height:100%;background:var(--fg);border-radius:4px}
.o{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.o-me{--c:var(--me)}.o-mate{--c:var(--mate)}.o-claude{--c:var(--claude)}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);white-space:nowrap}
.whos{display:inline-flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ring);font-size:12px;color:var(--mute);white-space:nowrap}
.chip.here{background:var(--hot);color:var(--on-hot);box-shadow:none}
.chip.done{background:var(--btn);color:var(--on-btn);box-shadow:none}
.late{color:var(--late)!important}
.empty{color:var(--mute);font-size:13px;padding:14px 0}
.seg{display:flex;padding:3px;background:var(--panel);border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--mute);font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--btn);color:var(--on-btn)}
.seg button.on .o{box-shadow:0 0 0 1.5px var(--on-btn)}

/* ── HOME：左欄 色體圖＋優先順序，右欄 本週＋本週重點 ── */
.home{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:14px;padding-top:16px;padding-bottom:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.col>*+*{animation-delay:80ms}
.hd{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.big{font-size:46px;font-weight:650;letter-spacing:-.03em;line-height:1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--faint);font-weight:500;letter-spacing:0;margin-left:4px}
.wk .meter{margin:12px 0 6px}
.wk .pct{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.wk .pct b{color:var(--fg);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.stats .wide{grid-column:1/-1}
.stats .wide b{font-size:15px}
/* 收納按鈕 */
.tg{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--panel);color:var(--mute);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;white-space:nowrap;transition:color .2s}
.tg:hover{color:var(--fg)}
.tg i{font-style:normal;display:inline-block;transition:transform .2s}
.tg.on i{transform:rotate(90deg)}
.fl+.tg{margin-top:10px}
.tg+.fl{margin-top:6px}
/* 本週重點清單 */
.fl{display:flex;flex-direction:column}
.fr{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;border-radius:0;transition:background .15s}
.fr:last-child{border-bottom:0}
.fr:hover{background:var(--panel)}
.ck{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--faint);display:grid;place-items:center}
.ck svg{width:11px;height:11px;stroke:var(--on-btn);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fr.done .ck{background:var(--fg);box-shadow:none}
.fr.done .ft{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.fr .fm{display:flex;flex-direction:column;gap:3px;min-width:0}
.fr .ft{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 色體圖：中間直軸＝整體完成度（由下往上填）；每個階段一條分支，伸出去的長度＝該階段完成度，一格 10%，伸到底＝完成 */
.chromo{position:relative}
.cx-end{display:block;text-align:center;font-size:10px;padding:4px 0}
.cx-rows{position:relative;display:flex;flex-direction:column-reverse;padding:6px 0}
.cx-ax{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--ring)}
.cx-ax i{position:absolute;left:0;right:0;bottom:0;height:var(--v);border-radius:6px;background:var(--fg)}
.br{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:center;min-height:62px;cursor:pointer;border-radius:12px;transition:background .15s}
.br:hover{background:var(--panel)}
.nd{grid-column:2;justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--faint);z-index:1}
.br.open .nd{box-shadow:inset 0 0 0 2px var(--fg)}
.br.done .nd{background:var(--fg);box-shadow:none}
.br.here .nd{background:var(--hot);box-shadow:0 0 0 5px color-mix(in srgb,var(--hot) 22%,transparent)}
.arm{display:flex;flex-direction:column;gap:5px;min-width:0;padding:6px 0}
.arm.L{grid-column:1;align-items:flex-end;text-align:right}
.arm.R{grid-column:3;align-items:flex-start}
.arm .lb{display:flex;align-items:baseline;gap:8px;font-size:14px;white-space:nowrap;max-width:100%}
.arm.L .lb{flex-direction:row-reverse}
.arm .lb b{font-weight:650;overflow:hidden;text-overflow:ellipsis}
.br.ahead .arm .lb b{color:var(--mute);font-weight:500}
.arm .sub{font-size:10px}
.trk{position:relative;width:100%;height:12px;border-radius:3px;background-image:linear-gradient(90deg,var(--ring) 1px,transparent 1px);background-size:10% 100%;box-shadow:inset 0 0 0 1px var(--line)}
.arm.L .trk{transform:scaleX(-1)}
.fill{position:absolute;left:0;top:0;bottom:0;width:var(--v);display:flex;border-radius:3px;overflow:hidden}
.fill span{height:100%;flex:none;width:var(--w);background:var(--c)}
.knob{position:absolute;top:50%;left:var(--v);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px var(--fg)}
.br.here .knob{background:var(--hot);box-shadow:0 0 0 2px var(--hot)}
.br.ahead .knob{box-shadow:0 0 0 1.5px var(--faint)}
.br.fold{min-height:34px}
.fchip{grid-column:1/-1;justify-self:center;z-index:1;background:var(--fg);color:var(--on-btn);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.cx-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cx-foot .sp{flex:1}
.ttl-h{margin:0 0 2px;font-size:22px;font-weight:650;letter-spacing:-.01em}

/* 3D 色立體：照資料庫 Data Tank 首頁的「軸＋立著的卡片環」。
   一根直軸穿過每一層的圓心。最底層＝8 個階段總覽：每個階段一個方向（像色相環），往外 10 格，一格 10%，填到第幾格＝完成到哪（往外越鮮豔，像孟塞爾的彩度）。
   往上第 k 層＝每個階段的第 k 件工作，同一個方向，往外伸＝那件工作的完成度。卡片面朝外立著，像 Data Tank 的玻璃卡 */
.sc{position:relative;height:calc((var(--n) - 1) * var(--lv) + var(--u) * 8.4 + 22px);perspective:1400px;perspective-origin:50% 40%;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;--u:20px;--lv:24px;overflow:hidden;margin:0 -20px}
.sc.drag{cursor:grabbing}
.so{position:absolute;left:50%;top:calc(100% - var(--u) * 5.1 - 26px);width:0;height:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry))}   /* 原點＝底層圓心，往上疊 */
.so *{transform-style:preserve-3d}
/* 軸：兩片交叉的細線，從哪個角度看都看得到；下段實線＝整體完成度 */
.ax3{position:absolute;left:0;top:0}
.ax3 i{position:absolute;left:-.5px;top:calc(var(--top) - 14px);width:1px;height:calc(var(--bot) - var(--top) + 28px);background:linear-gradient(to top,var(--fg) var(--v),var(--faint) var(--v))}
.ax3 i:nth-child(2){transform:rotateY(90deg)}
.ax3 b{position:absolute;left:-3.5px;top:calc(var(--bot) + 11px);width:7px;height:7px;border-radius:50%;background:var(--fg)}
/* 底層的刻度圈：50%、100% */
.fl3{position:absolute;left:0;top:0;width:0;height:0;transform:translateY(calc(var(--bot) + var(--hh))) rotateX(90deg)}
.fl3 i{position:absolute;left:calc(var(--d) / -2);top:calc(var(--d) / -2);width:var(--d);height:var(--d);border-radius:50%;box-shadow:inset 0 0 0 1px var(--ring)}
.fl3 i.half{box-shadow:none;border:1px dashed var(--ring)}
/* 卡片：沿半徑方向一格一張，面朝外立著 */
.c3{position:absolute;left:calc(var(--w) / -2);top:calc(var(--hh) * -1);width:var(--w);height:calc(var(--hh) * 2);border-radius:calc(var(--w) * .07);transform:translateY(var(--y)) rotateY(var(--a)) translateZ(var(--r));backface-visibility:visible;
  background:linear-gradient(to top,var(--c) var(--f),transparent var(--f)),var(--glass);box-shadow:0 0 0 1px var(--glass-edge),inset 0 0 0 1px rgba(0,0,0,.05);transition:opacity .25s}
.c3::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.45),rgba(255,255,255,.08) 30%,transparent 48%,transparent 72%,rgba(255,255,255,.22))}
.c3.e{--f:0%;opacity:.42}
.c3.t{--w:calc(var(--u) * 1.05);--hh:calc(var(--u) * .3);cursor:pointer}
.c3.t.e{opacity:.3}
.c3.t:hover{box-shadow:0 0 0 1.5px var(--fg)}
.bx.ahead .c3:not(.e){opacity:.7}
.bx.here .c3.top{box-shadow:0 0 0 1.5px var(--hot)}
/* 階段名稱：放在底層最外圈外面，永遠面向鏡頭 */
.l3{position:absolute;left:0;top:0;transform:translateY(var(--y)) rotateY(var(--a)) translateZ(var(--r)) rotateY(calc(-1 * (var(--a) + var(--ry)))) rotateX(calc(-1 * var(--rx)))}
.l3 button{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;border:0;background:var(--bar);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--fg);border-radius:999px;padding:3px 9px 3px 6px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:0 0 0 1px var(--ring)}
.l3 button i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.l3 button em{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--mute);font-weight:500}
.l3 button:hover{box-shadow:0 0 0 1.5px var(--fg)}
.bx.here .l3 button{background:var(--hot);color:var(--on-hot);box-shadow:none}
.bx.here .l3 button em{color:var(--on-hot);opacity:.85}
.bx.ahead .l3 button{color:var(--mute);font-weight:500}
.bx.fold .l3 button{background:var(--fg);color:var(--on-btn);box-shadow:none}
.bx.fold .l3 button em{color:var(--on-btn);opacity:.7}
.e3{position:absolute;left:0;top:0;transform:translateY(var(--y)) rotateY(calc(-1 * var(--ry))) rotateX(calc(-1 * var(--rx)))}
.e3 span{position:absolute;left:0;top:0;transform:translate(10px,-50%);font-size:10px;white-space:nowrap}
.e3.mid span{transform:translate(-50%,-50%)}
.cx-foot>.mono{white-space:normal}
@media (max-width:440px){.l3 button{font-size:11px;padding:2px 7px 2px 5px}.l3 button em{display:none}}
.cvs{display:flex;gap:2px;padding:2px;background:var(--panel);border-radius:999px}
.cvs button{border:0;background:none;color:var(--mute);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;cursor:pointer}
.cvs button.on{background:var(--btn);color:var(--on-btn)}

/* 優先順序：十字軸，無底色。上＝重要、右＝緊急 */
.qx{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;margin:16px 26px 2px 0}
.qx::before{content:"";position:absolute;left:50%;top:-14px;bottom:0;width:1.5px;margin-left:-.75px;background:var(--fg)}
.qx::after{content:"";position:absolute;top:50%;left:0;right:-16px;height:1.5px;margin-top:-.75px;background:var(--fg)}
.qx .ay,.qx .axr{position:absolute;font-size:10px;color:var(--fg)}
.qx .ay{left:50%;top:-22px;transform:translate(-50%,-50%);background:var(--tile-s);padding:0 6px}
.qx .axr{right:-26px;top:50%;transform:translate(0,-130%)}
.qx .ay::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-bottom:6px solid var(--fg);border-top:0;transform:translateY(2px)}
.qc{padding:6px 12px 8px;display:flex;flex-direction:column;gap:1px;min-width:0;min-height:0}
.qc>.mono{font-size:10px;margin-bottom:4px}
.qc.hot>.mono{color:var(--hot)}
.qi{display:flex;align-items:center;gap:7px;border:0;background:none;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12.5px;text-align:left;min-width:0;transition:background .15s}
.qi:hover{background:var(--panel)}
.qi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi.top span{font-weight:650}
.qi .os{display:flex;gap:2px;flex:none}
.qm{padding:4px;text-decoration:none}

/* 階段詳情裡的工作清單 */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:baseline;padding:7px 6px;border-radius:8px;cursor:pointer;transition:background .15s}
.tl li:hover{background:var(--panel)}
.tl .st{font-size:12px;color:var(--faint);text-align:center}
.tl li.done .st{color:var(--ok)}
.tl li.done .tt{color:var(--mute)}
.tl .tt{font-size:14px;min-width:0}
.tl .tt .os{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.res{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--ring);text-decoration:none;transition:box-shadow .2s}
.res a:hover{box-shadow:inset 0 0 0 1px var(--mute)}
.res a b{font-size:13px;font-weight:600;flex:1;min-width:0}
.res a svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none;color:var(--mute)}
/* 進度紀錄 */
.lg{list-style:none;margin:0;padding:0}
.lg li{display:grid;grid-template-columns:72px 92px 1fr;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.lg li:last-child{border-bottom:0}
.home-log{padding-top:12px;padding-bottom:80px}

/* ── TASKS ── */
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:32px 0 20px}
.bar2 .sp{flex:1}
.ttl{margin:0;font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.01em}
.load{margin-bottom:16px;padding:18px 0 16px}
.gs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.gin{min-width:820px;padding:0 18px}
.g{display:grid;grid-template-columns:230px 1fr;align-items:center}
.g .gl{padding-right:12px;min-width:0;position:sticky;left:0;z-index:2;background:var(--tile-s)}
.g .gw{position:relative;height:100%;min-height:30px}
.grid-bg{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--n)) 100%}
.ruler .gw{display:grid;grid-template-columns:repeat(var(--n),1fr);min-height:0}
.ruler .gw span{font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;color:var(--mute);padding:0 0 6px 3px;border-left:1px solid var(--line)}
.ruler .gw span.cur{color:var(--hot);font-weight:700;border-left-color:var(--hot)}
.nowl{position:absolute;top:0;bottom:0;width:1px;background:var(--hot);opacity:.55;pointer-events:none;z-index:1}
.gph{margin-top:14px}
.gph .gl b{font-size:13px;font-weight:650}
.gph .gl{display:flex;align-items:baseline;gap:8px}
.gph .pb{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--faint);opacity:.45}
.grow{width:100%;border:0;background:none;padding:3px 0;cursor:pointer;text-align:left;border-radius:8px;transition:background .15s}
.grow:hover{background:var(--panel)}
.grow .gl{display:flex;flex-direction:column;gap:1px;padding-left:12px}
.grow .tt{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow.done .tt{color:var(--mute)}
.gb{position:absolute;top:5px;bottom:5px;border-radius:6px;overflow:hidden;display:flex;align-items:center;padding:0 7px;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--oc1) 45%,transparent)}
.gb::before{content:"";position:absolute;inset:0;background:var(--ocg);opacity:.2}
.gb i{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--ocg);opacity:.55}
.gb em{position:relative;font-style:normal;font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--oc1)}
.grow.done .gb i{opacity:.8}
.grow.done .gb em{color:#fff}
.grow.late .gb{box-shadow:inset 0 0 0 1.5px var(--late)}
/* 人力色塊圖：每人每週同時在做幾件 */
.lr .gw{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;height:30px}
.lr .gw span{border-radius:4px;background:color-mix(in srgb,var(--c) var(--k),var(--panel));display:grid;place-items:center;font-family:var(--font-mono);font-size:9px;color:#fff;font-weight:700}
.lr .gw span.z{background:var(--panel)}
.lr .gl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.lr+.lr{margin-top:4px}
/* 清單檢視 */
.lst .ph{display:flex;align-items:baseline;gap:10px;margin:22px 0 6px}
.lst .ph b{font-size:15px}
.lrow{display:grid;grid-template-columns:20px 1fr 150px 86px 110px;gap:12px;align-items:center;width:100%;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;transition:background .15s}
.lrow:hover{background:var(--panel)}
.lrow .tt{font-size:14px;min-width:0}
.lrow .meter{width:100%}
.lrow.done .tt{color:var(--mute)}

/* ── PARTS ── */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sum .tile b{display:block;font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:-.01em}
.sum .tile small{color:var(--mute);font-size:12px}
.bud{position:relative;height:12px;border-radius:6px;background:var(--panel);margin:8px 0 6px;overflow:hidden}
.bud span{position:absolute;top:0;bottom:0;left:0}
.bud .hi{background:repeating-linear-gradient(135deg,var(--faint) 0 3px,transparent 3px 7px);opacity:.7}
.bud .lo{background:var(--faint)}
.bud .od{background:var(--fg)}
.bkey{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--mute);margin-bottom:28px}
.bkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pt-row{display:grid;grid-template-columns:28px 1fr 90px 150px 44px 220px;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.pt-row .nm b{font-size:14.5px;font-weight:600;display:block}
.pt-row .nm small{color:var(--mute);font-size:12.5px}
.pt-row .pr{font-variant-numeric:tabular-nums;font-size:14px}
.steps{display:flex;align-items:center;gap:0}
.steps span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.steps span::before{content:"";width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor}
.steps span+span::after{content:none}
.steps em{flex:1;min-width:10px;height:1px;background:var(--line);margin:0 6px}
.steps span.on{color:var(--fg)}
.steps span.on::before{background:currentColor}
.steps span.cur{font-weight:600}
.phd{display:grid;grid-template-columns:28px 1fr 90px 150px 44px 220px;gap:14px;padding:0 4px 8px;border-bottom:1px solid var(--line)}

/* ── DATA ── */
.rs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;margin-bottom:48px}
.rc{padding:22px 24px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both;scroll-margin-top:90px}
.rc.hl{box-shadow:inset 0 0 0 1.5px var(--hot)}
.rc h3{margin:8px 0 8px;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.35}
.rc p{margin:0 0 14px;color:var(--mute);font-size:14px}
.rc table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.rc th{font-weight:500;color:var(--mute);font-size:12px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--ring)}
.rc td{padding:7px 8px;border-bottom:1px solid var(--line)}
.rc td b{color:var(--hot);font-weight:700}
.rc .fp{display:block;margin-top:14px;font-family:var(--font-mono);font-size:11.5px;color:var(--mute);word-break:break-all}

/* ── 任務詳情 ── */
.dlg{width:min(460px,calc(100vw - 32px));padding:26px;border:0;border-radius:18px;background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--ring),var(--shadow)}
.dlg::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(4px)}
.dlg h2{margin:8px 0 16px;font-family:var(--serif);font-size:20px;line-height:1.35;font-weight:600}
.dlg dl{display:grid;grid-template-columns:72px 1fr;gap:10px 14px;margin:0;font-size:14px}
.dlg dt{color:var(--mute);font-size:12px;padding-top:2px}
.dlg dd{margin:0}
.dlg .x{position:absolute;right:14px;top:14px}
.lv{display:inline-flex;gap:3px;vertical-align:middle}
.lv i{width:16px;height:5px;border-radius:3px;background:var(--panel)}
.lv i.on{background:var(--fg)}
.foot{padding:28px 0 60px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}


/* ── HOME：照 NKUST Racing 工作台首頁。左上 3D、右上月曆、左下本週重點、右下象限；下排不放卡片底 ── */
.hv-mono{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;color:var(--faint);font-variant-numeric:tabular-nums}
.hv-eyebrow{font:600 11px/1.3 var(--font-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.hv-empty{font-size:12px;color:var(--faint);padding:8px 0}
.hv-big{font:700 15px/1 var(--font-mono);color:var(--fg);margin-right:2px}
.hv-home{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;grid-template-areas:"car cal" "list matrix";padding-top:28px;padding-bottom:40px}
.hv-area-car{grid-area:car}.hv-area-cal{grid-area:cal}.hv-area-list{grid-area:list}.hv-area-matrix{grid-area:matrix}
.hv-card{min-width:0;display:flex;flex-direction:column}
.hv-card.hv-bare{background:none;border:0;box-shadow:none;padding:20px 6px 8px;backdrop-filter:none;-webkit-backdrop-filter:none}
.hv-area-list.hv-bare{padding-right:40px}
.hv-area-matrix.hv-bare{padding-left:28px}
.hv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:24px}
.hv-head .r{display:flex;align-items:center;gap:12px}
.hv-area-car .sc{flex:1 0 auto}
.hv-area-car .so{top:calc(100% - var(--u) * 5.1 - 44px)}   /* 前排標籤不要被卡片底切到 */
.hv-car-foot{display:flex;justify-content:flex-end;margin-top:4px}
/* 點陣月曆 */
.hv-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hv-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.hv-cal-wd{font:500 10px var(--font-mono);color:var(--faint);text-align:center;padding-bottom:6px}
.hv-day{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.hv-dot{display:block;border-radius:50%;background:var(--fg);flex:none;width:6px;height:6px}
.hv-dot.n2{width:8px;height:8px}.hv-dot.n3{width:10px;height:10px}
.hv-dot--empty{width:4px;height:4px;background:var(--line-2);margin:2px 0}
.hv-day-num{font:500 10px/1 var(--font-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.hv-day.is-wk .hv-day-num{color:var(--mute)}
.hv-day.is-past{opacity:.4}
.hv-day.has-log .hv-dot{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.hv-day.has-late .hv-dot{background:var(--hot);box-shadow:none}
.hv-day.is-today .hv-day-num{color:var(--hot);font-weight:700}
.hv-day.is-today .hv-dot--empty{width:8px;height:8px;background:var(--hot);margin:0}
.hv-day.is-today.has-due .hv-dot{background:var(--hot);box-shadow:none}
.hv-agenda{margin-top:14px;padding-top:12px;border-top:.5px solid var(--line-2)}
.hv-agenda .hv-eyebrow{margin-bottom:6px;display:block}
.hv-agenda-row{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:baseline;gap:8px;border:0;background:none;padding:6px 0;cursor:pointer;text-align:left;color:var(--fg)}
.hv-agenda-title{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv-agenda-row:hover .hv-agenda-title{color:var(--fg)}
.hv-agenda-owner{font-size:11px;color:var(--faint);white-space:nowrap}
/* 本週重點 */
.hv-list{display:flex;flex-direction:column}
.hv-list-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:.5px solid var(--line-2)}
.hv-list-row:last-child{border-bottom:0}
.hv-check{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--faint)}
.hv-list-row.is-done .hv-check{background:var(--faint);border-color:transparent}
.hv-list-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--fg)}
.hv-list-title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv-list-main:hover .hv-list-title{color:var(--hot)}
.hv-list-owner{font-size:11px;color:var(--faint);flex:none}
.hv-list-due{flex:none}
.hv-list-due.is-late{color:var(--hot)}
.hv-list-due.is-now{color:var(--fg)}
.hv-list-row.is-done .hv-list-title{color:var(--faint);text-decoration:line-through}
/* 四象限 */
.hv-matrix{position:relative;flex:1;min-height:300px}
.hv-axis{position:absolute;background:var(--line-2);pointer-events:none}
.hv-axis--x{left:0;right:0;top:50%;height:1px}
.hv-axis--y{top:0;bottom:0;left:50%;width:1px}
.hv-axis--x::after,.hv-axis--y::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.hv-axis--x::after{right:-2px;top:-2px}.hv-axis--y::after{top:-2px;left:-2px}
.hv-q{position:absolute;font:500 10px var(--font-mono);letter-spacing:.08em;color:var(--faint);padding:4px 6px}
.hv-q--tl{left:0;top:0}.hv-q--tr{right:0;top:0;color:var(--mute)}.hv-q--bl{left:0;bottom:0}.hv-q--br{right:0;bottom:0}
.hv-pin{position:absolute;transform:translate(-5px,-50%);display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:3px 0;cursor:pointer;max-width:46%;z-index:1;color:var(--fg)}
.hv-pin i{width:10px;height:10px;border-radius:50%;background:var(--fg);flex:none;transition:transform .15s}
.hv-pin span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hv-pin.is-left{flex-direction:row-reverse;transform:translate(calc(-100% + 5px),-50%)}
.hv-pin:hover{z-index:2}.hv-pin:hover span{color:var(--fg)}.hv-pin:hover i{transform:scale(1.25)}
.hv-pin.is-late i{background:var(--hot)}
@media (max-width:768px){
  .hv-home{grid-template-columns:minmax(0,1fr);grid-template-areas:"car" "cal" "matrix" "list";gap:12px;padding-top:16px}
  .hv-card{padding:16px 16px 18px}
  .hv-card.hv-bare,.hv-area-list.hv-bare,.hv-area-matrix.hv-bare{padding:16px 4px 8px}
  .hv-matrix{min-height:280px}
  .hv-pin{max-width:48%}
}

/* ── REPORT ── */
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:32px 0 20px}
.cbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 18px;background:var(--btn);color:var(--on-btn);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.cbtn:hover{opacity:.88}
.cbtn.ghost{background:none;color:var(--fg);box-shadow:inset 0 0 0 1px var(--ring);padding:6px 14px;font-size:12px}
.cbtn.ghost:hover{background:var(--panel)}
.ch-list{display:flex;flex-direction:column;gap:16px;margin-bottom:48px}
.chp{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.chp-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chp-h h3{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3}
.chp-h .sp{flex:1}
.ready{display:inline-flex;gap:5px}
.ready i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint)}
.ready i.on{background:var(--hot);box-shadow:none}
.chp-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:16px}
.chp-g ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chp-g li{font-size:13.5px;line-height:1.5;min-width:0;padding:7px 0;border-bottom:.5px solid var(--line-2)}
.chp-g li:last-child{border-bottom:0}
.chp-g li small{display:block;color:var(--faint);font-size:12px}
.chp-g li .hv-mono{margin-right:8px}
.chp-g li a{text-decoration:none}
.chp-g li a:hover b{color:var(--hot)}
.chp-g li b{font-weight:600}
@media (max-width:760px){.chp-g{grid-template-columns:1fr;gap:12px}}

/* 換頁不播淡入動畫：在背景分頁或慢的機器上會看起來像跳格 */
main,main *{animation:none!important}

/* ── 窄螢幕 ── */
@media (max-width:1060px){
  .home{grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr)}
  .sum{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  header .wrap{gap:8px;height:56px}
  .brand .mono{display:none}
  .brand b{font-size:14px}
  .tabs a{padding:7px 9px;letter-spacing:.06em;font-size:10.5px}
  .home{grid-template-columns:1fr;padding-top:18px}
  .col{display:contents}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}
  .big{font-size:46px}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAY=864e5;
const store={get(k){try{return localStorage.getItem('sail:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('sail:'+k,v)}catch(e){}}};
const ARROW='<svg viewBox="0 0 16 16"><path d="M4 8h8M8.5 4.5 12 8l-3.5 3.5"/></svg>';
const CHECK='<svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6l4.6-5"/></svg>';

let D,P,T,W,N,START,M;
let ui={own:store.get('own')||'all',view:store.get('view')||'gantt',cv:store.get('cv')||'3d'};

/* ── 週次與日期 ── */
const wkDate=n=>new Date(START.getTime()+(n-1)*7*DAY);
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const wkRange=(a,b=a)=>`${md(wkDate(a))} – ${md(new Date(wkDate(b).getTime()+6*DAY))}`;
const wr=(a,b)=>a===b?`W${pad(a)}`:`W${pad(a)}–${pad(b)}`;
const fmtDay=s=>{const [y,m,d]=s.split('-');return `${+m}/${+d}`};
const money=n=>'NT$ '+Math.round(n).toLocaleString('en-US');

/* ── 任務狀態 ── */
const isDone=t=>t.status==='done';
const isLate=t=>!isDone(t)&&t.end<W;
const inWeek=t=>t.start<=W&&W<=t.end;
const ofPhase=p=>T.filter(t=>t.phase===p.n);
const phaseState=p=>{const ts=ofPhase(p);if(ts.length&&ts.every(isDone))return 'done';if(p===HERE)return 'here';return p.start<=W?'open':'ahead'};
let HERE;
const own=o=>`<span class="who"><i class="o o-${o}"></i>${esc(M[o]||o)}</span>`;
const dots=t=>`<span class="os">${t.owners.map(o=>`<i class="o o-${o}" title="${esc(M[o])}"></i>`).join('')}</span>`;
const ocol=t=>t.owners.map(o=>`var(--${o})`);
const grad=t=>{const c=ocol(t);return c.length<2?c[0]:`linear-gradient(90deg,${c.map((x,i)=>`${x} ${i*100/c.length}% ${(i+1)*100/c.length}%`).join(',')})`};
const stLabel=t=>isDone(t)?'完成':t.status==='doing'?'進行中':isLate(t)?'延遲':'未開始';
const stGlyph=t=>isDone(t)?'✓':t.status==='doing'?'◐':'○';
const avg=ts=>ts.length?Math.round(ts.reduce((s,t)=>s+(isDone(t)?100:+t.progress||0),0)/ts.length):0;

/* ── HOME ── */
let fold={phase:true,focus:true};   // 已完成的階段、本週已完成的工作預設收起來
function viewHome(){
  const open=T.filter(t=>(inWeek(t)||isLate(t))&&!isDone(t)).sort((a,b)=>isLate(b)-isLate(a)||a.end-b.end||b.imp-a.imp);
  const weekDone=T.filter(t=>inWeek(t)&&isDone(t));
  const now=new Date();
  return `
<section class="wrap hv-home">
  <div class="tile hv-card hv-area-car">${ui.cv==='flat'?chromo():chart3d()}</div>
  <div class="tile hv-card hv-area-cal">
    <div class="hv-head"><span class="hv-eyebrow">Calendar</span><span class="hv-mono">${now.getMonth()+1}月${now.getDate()}日 週${'日一二三四五六'[now.getDay()]}</span></div>
    ${calendar()}
  </div>
  <div class="hv-card hv-bare hv-area-list">
    <div class="hv-head"><span class="hv-eyebrow">本週重點</span><span class="hv-mono"><b class="hv-big">${open.length}</b> 件待辦</span></div>
    <div class="hv-list">${open.map(t=>listRow(t)).join('')}${weekDone.map(t=>listRow(t)).join('')}${open.length+weekDone.length?'':'<div class="hv-empty">本週沒有工作</div>'}</div>
  </div>
  <div class="hv-card hv-bare hv-area-matrix">
    <div class="hv-head"><span class="hv-eyebrow">優先順序</span><span class="hv-mono">W${pad(W)}–${pad(Math.min(N,W+3))}</span></div>
    ${matrix()}
  </div>
</section>
${foot()}`;
}
// 一週的「到期日」＝那週的星期日
const dueDate=t=>new Date(wkDate(t.end).getTime()+6*DAY);
const dayKey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const names=t=>t.owners.map(o=>esc(M[o]||o)).join('、');
function dueText(t){
  if(isDone(t))return '完成';
  if(isLate(t))return `晚 ${W-t.end} 週`;
  return t.end===W?'本週':t.end===W+1?'下週':`W${pad(t.end)}`;
}
function listRow(t){
  const d=isDone(t),cls=d?'':isLate(t)?'is-late':t.end===W?'is-now':'';
  return `<div class="hv-list-row ${d?'is-done':''}"><span class="hv-check"></span>
    <button class="hv-list-main" data-t="${t.id}"><span class="hv-list-title">${esc(t.title)}</span><span class="hv-list-owner">${names(t)}</span></button>
    <span class="hv-mono hv-list-due ${cls}">${dueText(t)}</span></div>`;
}
// 點陣月曆：從本週一起 4 週。實心點＝那天有工作到期（越多越大，延遲為橘），空心圈＝那天有進度紀錄
function calendar(){
  const from=wkDate(W),today=new Date();today.setHours(0,0,0,0);
  const due={},logs=new Set(D.log.map(l=>{const [y,m,d]=l.date.split('-').map(Number);return dayKey(new Date(y,m-1,d))}));
  for(const t of T){if(isDone(t))continue;const k=dayKey(dueDate(t));(due[k]=due[k]||[]).push(t)}
  let cells='';
  for(let i=0;i<28;i++){
    const d=new Date(from.getTime()+i*DAY),k=dayKey(d),ts=due[k]||[];
    const cls=[d<today?'is-past':'',dayKey(today)===k?'is-today':'',i%7>=5?'is-wk':'',ts.length?'has-due':'',ts.some(isLate)?'has-late':'',!ts.length&&logs.has(k)?'has-log':''].join(' ');
    const dot=ts.length||logs.has(k)?`<i class="hv-dot n${Math.min(3,ts.length||1)}"></i>`:'<i class="hv-dot hv-dot--empty"></i>';
    cells+=`<div class="hv-day ${cls}" title="${md(d)}${ts.length?' · '+ts.map(t=>esc(t.title)).join('、'):''}">${dot}<span class="hv-day-num">${d.getDate()===1||i===0?md(d):d.getDate()}</span></div>`;
  }
  const next=T.filter(t=>!isDone(t)&&t.end>=W).sort((a,b)=>a.end-b.end||b.imp-a.imp).slice(0,3);
  return `<div class="hv-cal-nav"><span class="hv-mono">${md(from)} – ${md(new Date(from.getTime()+27*DAY))}</span><span class="hv-mono">W${pad(W)} / ${N}</span></div>
  <div class="hv-cal-grid">${'一二三四五六日'.split('').map(w=>`<span class="hv-cal-wd">${w}</span>`).join('')}${cells}</div>
  <div class="hv-agenda"><span class="hv-eyebrow">接下來</span>
    ${next.map(t=>`<button class="hv-agenda-row" data-t="${t.id}"><span class="hv-mono">${md(dueDate(t))}</span><span class="hv-agenda-title">${esc(t.title)}</span><span class="hv-agenda-owner">${names(t)}</span></button>`).join('')||'<div class="hv-empty">沒有待辦</div>'}
  </div>`;
}
// 四象限：上＝重要、右＝緊急。每格的點從角落往軸心排開，最多 8 件（延遲、到期近、分數高的先）
function matrix(){
  const imp=t=>t.imp>=3,urg=t=>t.urg>=3||t.end<=W+1||isLate(t);
  const items=T.filter(t=>!isDone(t)&&t.start<=W+1).sort((a,b)=>isLate(b)-isLate(a)||a.end-b.end||(b.imp+b.urg)-(a.imp+a.urg)).slice(0,8);
  const placed=[];
  for(const [I,U] of [[1,0],[1,1],[0,0],[0,1]]){
    const g=items.filter(t=>imp(t)==I&&urg(t)==U),n=g.length;
    g.forEach((t,k)=>{
      const f=n>1?k/(n-1):.5;
      const y=I?16+f*Math.min(26,n*7):58+f*Math.min(26,n*7);
      const x=U?88-f*22:12+f*22;
      placed.push({t,x,y});
    });
  }
  return `<div class="hv-matrix"><span class="hv-axis hv-axis--x"></span><span class="hv-axis hv-axis--y"></span>
    <span class="hv-q hv-q--tl">重要・不急</span><span class="hv-q hv-q--tr">重要・緊急</span><span class="hv-q hv-q--bl">一般・不急</span><span class="hv-q hv-q--br">一般・緊急</span>
    ${placed.map(p=>`<button class="hv-pin ${p.x>50?'is-left':''} ${isLate(p.t)?'is-late':''}" style="left:${p.x}%;top:${p.y}%" data-t="${p.t.id}" title="${esc(p.t.title)}"><i></i><span>${esc(p.t.title)}</span></button>`).join('')}
    ${placed.length?'':'<div class="hv-empty" style="position:absolute;left:0;right:0;top:56%;text-align:center">沒有待辦</div>'}
  </div>`;
}
function focusRow(t){
  return `<button class="fr ${isDone(t)?'done':''}" data-t="${t.id}">
    <span class="ck">${isDone(t)?CHECK:''}</span>
    <span class="fm"><span class="ft">${esc(t.title)}</span><span class="whos">${t.owners.map(own).join('')}</span></span>
    <span class="mono ${isLate(t)?'late':''}">${isDone(t)?'完成':isLate(t)?`延遲 · W${pad(t.end)}`:`到期 W${pad(t.end)}`}</span>
  </button>`;
}
// 一個階段的完成度，並拆成每個負責人做了多少：每件工作佔 1/n，完成的進度平分給它的負責人
function phaseStat(p){
  const ts=ofPhase(p),by={};
  for(const t of ts){const v=(isDone(t)?100:+t.progress||0)/ts.length;for(const o of t.owners)by[o]=(by[o]||0)+v/t.owners.length}
  const sum=Object.values(by).reduce((a,b)=>a+b,0);
  return {ts,by,sum,dn:ts.filter(isDone).length};
}
// 3D 色立體（照 Data Tank 首頁的軸＋卡片環）：底層 8 個階段，往上每層是各階段的第 k 件工作
const HUE=i=>[15,210,85,335,35,190,60,260][i%8];   // Anthropic 插畫色：陶土、天藍、橄欖、無花果、牛皮紙、仙人掌、馬尼拉、石楠
let openDone=new Set();   // 已完成、但被點開來看的階段
const folded=p=>phaseState(p)==='done'&&fold.phase&&!openDone.has(p.n);
function solid3d(){
  const all=avg(T),R0=1.7,S=1;   // 第 1 格離軸 R0 格寬，之後每格往外 S
  const rad=k=>`calc(var(--u) * ${(R0+k*S).toFixed(2)})`;
  const card=(cls,y,a,k,f,c,extra='')=>`<span class="c3 ${cls}" style="--y:${y};--a:${a};--r:${rad(k)};--f:${(f*100).toFixed(1)}%;--c:${c}"${extra}></span>`;
  // 往外越鮮豔（彩度）；往上越晚開始的工作越淺、越透明，像樹：先長的粗、顏色深，後長的淡
  const col=(h,k,j=0)=>`hsl(${h} ${Math.max(10,30+k*6-j*3)}% ${Math.min(80,50-k*1.2+j*4.5)}% / ${Math.max(.32,.95-j*.11).toFixed(2)})`;
  const byStart=p=>ofPhase(p).map((t,i)=>[t,i]).sort((a,b)=>a[0].start-b[0].start||a[1]-b[1]).map(x=>x[0]);   // 一件工作一層，開始週早的在下面
  const layers=1+Math.max(1,...P.filter(p=>!folded(p)).map(p=>ofPhase(p).length));
  const yOf=L=>`calc(var(--lv) * ${-L})`;
  const brs=P.map((p,i)=>{
    const h=HUE(i),a=`${i*45}deg`,st=phaseState(p),s=phaseStat(p),fd=folded(p);
    let cs='';
    // 底層：階段完成度，10 格都畫出來（空的淡）
    const v=s.sum/10;
    for(let k=0;k<(fd?1:10);k++){const f=fd?1:Math.max(0,Math.min(1,v-k));cs+=card(`${f>0?'':'e'}${k===Math.ceil(v)-1?' top':''}`,yOf(0),a,k,f,col(h,k))}
    // 往上：這個階段的每一件工作一層，只畫到它的完成度；還沒開始的留一張淡卡當位置
    if(!fd)byStart(p).forEach((t,j)=>{
      const tv=(isDone(t)?100:+t.progress||0)/10,n=Math.max(1,Math.ceil(tv)),tip=` data-t="${t.id}" title="${esc(t.title)} · ${Math.round(tv*10)}%"`;
      for(let k=0;k<n;k++){const f=Math.max(0,Math.min(1,tv-k));cs+=card(`t ${f>0?'':'e'}`,yOf(j+1),a,k,f,col(h,k,j+1),tip)}
    });
    const lab=`<div class="l3" style="--y:${yOf(0)};--a:${a};--r:${rad(fd?2.4:10.6)}"><button data-p="${p.n}"${fd?' data-open="1" title="點一下展開"':''} style="--c:hsl(${h} 45% 50%)"><i></i>${st==='done'?'✓ ':''}${esc(p.name)}<em>${Math.round(s.sum)}%</em></button></div>`;
    return `<div class="bx ${st}${fd?' fold':''}">${cs}${lab}</div>`;
  }).join('');
  return `<div class="sc" id="sc" style="--n:${layers}"><div class="so" id="so" style="--rx:${RX}deg;--ry:${RY}deg;--top:${yOf(layers-1)};--bot:${yOf(0)};--hh:calc(var(--u) * .42);--w:calc(var(--u) * 1.3)">
    <div class="ax3" style="--v:${all}%"><i></i><i></i><b></b></div>
    <div class="fl3"><i class="half" style="--d:calc(var(--u) * ${2*(R0+4.5*S)})"></i><i style="--d:calc(var(--u) * ${2*(R0+9.5*S)})"></i></div>
    ${brs}</div></div>`;
}
let RX=-20,RY=-28,spinId=0,drag=null,dragged=0,hoverSc=false,lastT=0;
const still=matchMedia('(prefers-reduced-motion: reduce)');
function spin(t){
  const so=$('#so');if(!so){spinId=0;return}
     // 跟 Data Tank 一樣 60 秒轉一圈
  lastT=t;so.style.setProperty('--ry',RY.toFixed(2)+'deg');so.style.setProperty('--rx',RX.toFixed(2)+'deg');
  spinId=requestAnimationFrame(spin);
}
function setupSolid(){
  const sc=$('#sc');if(!sc)return;
  const u=Math.max(9,Math.min(18,(sc.clientWidth/2-44)/12.4));
  sc.style.setProperty('--u',u+'px');sc.style.setProperty('--lv',Math.round(u*1.1+5)+'px');
  sc.onpointerenter=e=>{if(e.pointerType==='mouse')hoverSc=true};
  sc.onpointerleave=()=>{hoverSc=false};
  sc.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ry:RY,rx:RX,moved:false,id:e.pointerId}};
  sc.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;sc.classList.add('drag');try{sc.setPointerCapture(drag.id)}catch(_){}}
    if(drag.moved){RY=drag.ry+dx*.4;RX=Math.max(-40,Math.min(-4,drag.rx-dy*.25));if(!spinId)spinId=requestAnimationFrame(t=>{spinId=0;const so=$('#so');if(so){so.style.setProperty('--ry',RY.toFixed(2)+'deg');so.style.setProperty('--rx',RX.toFixed(2)+'deg')}})}};
  sc.onpointerup=sc.onpointercancel=()=>{if(drag&&drag.moved)dragged=Date.now();drag=null;sc.classList.remove('drag')};
  const so=$('#so');if(so){so.style.setProperty('--ry',RY.toFixed(2)+'deg');so.style.setProperty('--rx',RX.toFixed(2)+'deg')}
}
addEventListener('resize',()=>{if($('#sc'))setupSolid()});
function chart3d(){
  const done=P.filter(p=>phaseState(p)==='done');
  return `<div class="hv-head"><span class="hv-eyebrow">Phases</span><span class="r"><span class="hv-mono"><b class="hv-big">${avg(T)}%</b> 整體</span>${cvSwitch()}</span></div>
  ${solid3d()}
  ${done.length?`<div class="hv-car-foot"><button class="tg ${fold.phase?'':'on'}" data-fold="phase"><i>▸</i>已完成 ${done.length} 階段</button></div>`:''}`;
}
const cvSwitch=()=>`<span class="cvs" id="cv"><button data-cv="3d" class="${ui.cv!=='flat'?'on':''}">3D</button><button data-cv="flat" class="${ui.cv==='flat'?'on':''}">平面</button></span>`;
function chromo(){
  const all=avg(T),done=P.filter(p=>phaseState(p)==='done');
  const rows=P.map((p,i)=>{
    const st=phaseState(p),s=phaseStat(p),side=i%2?'L':'R';
    if(st==='done'&&fold.phase)return `<div class="br fold done" data-p="${p.n}" title="點開看這個階段"><span class="fchip">✓ ${pad(p.n)} ${esc(p.name)} · 100%</span></div>`;
    const segs=Object.keys(M).filter(o=>s.by[o]>0).map(o=>`<span style="--c:var(--${o});--w:${s.by[o]/s.sum*100}%" title="${esc(M[o])} ${Math.round(s.by[o])}%"></span>`).join('');
    const arm=`<div class="arm ${side}">

  }).join('');
  return `<div class="hv-head"><span class="hv-eyebrow">Phases</span><span class="r"><span class="hv-mono"><b class="hv-big">${all}%</b> 整體</span>${cvSwitch()}</span></div>

}
function quad(){
  // 重要＝重要度 3；緊急＝緊急度 3，或這週／下週到期，或已延遲。同一格內分數高的排前面、加粗
  const items=T.filter(t=>!isDone(t)&&t.start<=W+3);
  const imp=t=>t.imp>=3,urg=t=>t.urg>=3||t.end<=W+1||isLate(t);
  const cells=[['重要・不急',t=>imp(t)&&!urg(t)],['重要・緊急',t=>imp(t)&&urg(t),'hot'],['一般・不急',t=>!imp(t)&&!urg(t)],['一般・緊急',t=>!imp(t)&&urg(t)]];
  const CAP=3;
  return `<div class="qx"><span class="mono ay">重要</span><span class="mono axr">緊急 →</span>${cells.map(([l,f,c])=>{const ts=items.filter(f).sort((a,b)=>isLate(b)-isLate(a)||(b.imp+b.urg)-(a.imp+a.urg)||a.end-b.end);
    return `<div class="qc ${c||''}"><span class="mono">${l} · ${ts.length}</span>${ts.slice(0,CAP).map(t=>`<button class="qi ${t.imp+t.urg>=5?'top':''}" data-t="${t.id}" title="${esc(t.title)}">${dots(t)}<span class="${isLate(t)?'late':''}">${esc(t.title)}</span></button>`).join('')}${ts.length>CAP?`<a class="mono qm" href="#tasks">還有 ${ts.length-CAP} 件 →</a>`:''}</div>`}).join('')}</div>`;
}
function logList(ls){
  if(!ls.length)return '<div class="empty">還沒有紀錄</div>';
  return `<ul class="lg">${ls.map(l=>`<li><span class="mono">${fmtDay(l.date)}</span>${own(l.who)}<span class="tx">${esc(l.text)}</span></li>`).join('')}</ul>`;

function chMat(c){

function chText(c){
  const m=chMat(c),out=[`## 第 ${c.n} 章 ${c.name}`];
  if(m.tasks.length)out.push('','### 完成的工作',...m.tasks.map(t=>`- ${t.title}（${wr(t.start,t.end)}，${t.owners.map(o=>M[o]||o).join('、')}）${t.note?`：${t.note}`:''}`));
  if(m.logs.length)out.push('','### 進度紀錄',...m.logs.map(l=>`- ${l.date} ${M[l.who]||l.who}：${l.text}`));
  for(const r of m.res){
    out.push('',`### 成果：${r.title}`,r.summary);

async function copyText(txt,btn){
  const old=btn.textContent;
  try{await navigator.clipboard.writeText(txt)}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}
  btn.textContent='已複製';setTimeout(()=>{btn.textContent=old},1600);
}

}

  if($('#dlg').open)$('#dlg').close();
  $('#app').innerHTML=view();
  setupSolid();

  $('#app').style.animation='none';$('#app').offsetWidth;$('#app').style.animation='';

  const cp=e.target.closest('[data-copy]');if(cp){const k=cp.dataset.copy,CH=chapters();return copyText(`# ${D.project.title} 報告素材\n\n`+(k==='all'?CH:CH.filter(c=>String(c.n)===k)).map(chText).join('\n\n'),cp)}
  const f=e.target.closest('[data-fold]');if(f){fold[f.dataset.fold]=!fold[f.dataset.fold];openDone.clear();return render(true)}

  const ph=e.target.closest('[data-p]');if(ph){if(ph.dataset.open){openDone.add(+ph.dataset.p);return render(true)}return openPhase(+ph.dataset.p)}

// 三段：自動（跟系統）→ 淺色 → 深色。按鈕圖示跟著換
const THEMES=[['','自動（跟系統）','<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>'],
  ['light','淺色','<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'],
  ['dark','深色','<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/>']];
function themeBtn(){const t=document.documentElement.dataset.theme||'',m=THEMES.find(x=>x[0]===t)||THEMES[0],b=$('#theme');
  b.innerHTML=`<svg viewBox="0 0 24 24">${m[2]}</svg>`;b.title=b.ariaLabel=`配色：${m[1]}（點一下切換）`}
themeBtn();
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme||'',i=THEMES.findIndex(x=>x[0]===t),n=THEMES[(i+1)%3][0];applyTheme(n);store.set('theme',n);themeBtn()};

/* ── 載入資料 ── */
fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
  D=d;P=d.project.phases;T=d.tasks;N=d.project.weeks;M=d.project.members;
  const [y,m,dd]=d.project.start.split('-').map(Number);START=new Date(y,m-1,dd);
  const q=+new URLSearchParams(location.search).get('w');
  W=q||Math.floor((Date.now()-START.getTime())/(7*DAY))+1;W=Math.max(1,Math.min(N,W));
  HERE=P.find(p=>p.start<=W&&ofPhase(p).some(t=>!isDone(t)))||P.find(p=>p.start<=W&&W<=p.end)||P[P.length-1];
  $('#hw').textContent=`SAILBOAT · W${pad(W)} / ${N}`;
  render();
}).catch(e=>{$('#app').innerHTML=`<div class="wrap empty" style="padding:80px 28px">資料載入失敗：${esc(e.message)}</div>`});
</script>
</body>
</html>
